<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Style Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #000000, #1a1a1a);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }
        
        h1 {
            font-weight: 600;
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff2d70, #ff7eb3, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        .visualizer-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            margin-bottom: 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        #canvasContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .circle-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        
        .circle {
            position: absolute;
            background: transparent;
            width: calc(var(--i) * 2.5vmin);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 13, 0.7);
            transform-style: preserve-3d;
            transform: rotateX(70deg) translateZ(50px);
            animation: animate 3s ease-in-out calc(var(--i) * 0.08s) infinite;
            box-shadow: 0 0 15px rgba(124, 124, 124, 0.5), 
                inset 0 0 15px rgba(124, 124, 124, 0.5);
        }
        
        @keyframes animate {
            0%, 100% {
                transform: rotateX(70deg) translateZ(50px) translateY(0);
                filter: hue-rotate(0);
            }
            50% {
                transform: rotateX(70deg) translateZ(50px) translateY(-50vmin);
                filter: hue-rotate(360deg);
            }
        }
        
        .controls {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }
        
        .control-row {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }
        
        .control-label {
            width: 100px;
            font-weight: 500;
            color: #ff7eb3;
        }
        
        .slider-container {
            flex: 1;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff2d70;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 45, 112, 0.5);
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        button {
            background: linear-gradient(90deg, #ff2d70, #ff7eb3);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 45, 112, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 45, 112, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .now-playing {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ffcc00;
        }
        
        .file-input {
            margin: 20px 0;
            text-align: center;
        }
        
        .file-input label {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .file-input label:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .visualizer-container {
                height: 300px;
            }
            
            .controls {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="visualizer-container">
            <div id="canvasContainer"></div>
            <div class="circle-animation">
                <!-- 21 circles -->
                <div class="circle" style="--i:0;"></div>
                <div class="circle" style="--i:1;"></div>
                <div class="circle" style="--i:2;"></div>
                <div class="circle" style="--i:3;"></div>
                <div class="circle" style="--i:4;"></div>
                <div class="circle" style="--i:5;"></div>
                <div class="circle" style="--i:6;"></div>
                <div class="circle" style="--i:7;"></div>
                <div class="circle" style="--i:8;"></div>
                <div class="circle" style="--i:9;"></div>
                <div class="circle" style="--i:10;"></div>
                <div class="circle" style="--i:11;"></div>
                <div class="circle" style="--i:12;"></div>
                <div class="circle" style="--i:13;"></div>
                <div class="circle" style="--i:14;"></div>
                <div class="circle" style="--i:15;"></div>
                <div class="circle" style="--i:16;"></div>
                <div class="circle" style="--i:17;"></div>
                <div class="circle" style="--i:18;"></div>
                <div class="circle" style="--i:19;"></div>
                <div class="circle" style="--i:20;"></div>
            </div>
        </div>
        
        <div class="now-playing">
            <p>Now Playing: <span id="songTitle">Simulated Audio Visualization</span></p>
        </div>
        
        <div class="controls">
            <div class="control-row">
                <div class="control-label">Bass</div>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="70" class="slider" id="bassSlider">
                </div>
            </div>
            <div class="control-row">
                <div class="control-label">Treble</div>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="60" class="slider" id="trebleSlider">
                </div>
            </div>
            <div class="control-row">
                <div class="control-label">Intensity</div>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="80" class="slider" id="intensitySlider">
                </div>
            </div>
            <div class="control-row">
                <div class="control-label">Speed</div>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="50" class="slider" id="speedSlider">
                </div>
            </div>
            
            <div class="buttons">
                <button id="playButton">Play</button>
                <button id="pauseButton">Pause</button>
                <button id="randomizeButton">Randomize</button>
            </div>
            
            <div class="file-input">
                <label for="audioFile">Select Audio File</label>
                <input type="file" id="audioFile" accept="audio/*" style="display: none;">
            </div>
        </div>
    </div>

    <script>
        let audioContext;
        let analyser;
        let audioElement;
        let source;
        let dataArray;
        let bufferLength;
        let isPlaying = false;
        
        function setup() {
            let canvas = createCanvas(800, 400);
            canvas.parent('canvasContainer');
            
            // Create an audio context
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            // Create a placeholder audio element
            audioElement = new Audio();
            source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            
            colorMode(HSB, 360, 100, 100, 1);
            noStroke();
        }
        
        function draw() {
            background(0, 0, 0, 0.2); // Semi-transparent background for trail effect
            
            analyser.getByteFrequencyData(dataArray);
            
            const bass = document.getElementById('bassSlider').value / 100;
            const treble = document.getElementById('trebleSlider').value / 100;
            const intensity = document.getElementById('intensitySlider').value / 100;
            
            drawCircles(bass, treble, intensity);
        }
        
        function drawCircles(bass, treble, intensity) {
            push();
            translate(width / 2, height / 2);
            
            // Draw concentric circles based on frequency data
            for (let i = 0; i < 10; i++) {
                const radius = 30 + i * 20;
                const segment = floor(bufferLength / 10);
                let sum = 0;
                
                for (let j = 0; j < segment; j++) {
                    sum += dataArray[i * segment + j];
                }
                
                const avg = sum / segment;
                const pulse = avg / 255 * 50 * intensity;
                
                // Draw circle
                noFill();
                strokeWeight(2);
                stroke(i * 36, 80, 90, 0.7);
                ellipse(0, 0, (radius + pulse) * 2);
                
                // Draw points around circle
                for (let a = 0; a < TWO_PI; a += PI / 20) {
                    const x = cos(a) * (radius + pulse);
                    const y = sin(a) * (radius + pulse);
                    fill((a * 180 / PI) % 360, 80, 90, 0.8);
                    noStroke();
                    ellipse(x, y, 4, 4);
                }
            }
            
            pop();
        }
        
        // Event listeners
        document.getElementById('playButton').addEventListener('click', function() {
            if (!isPlaying) {
                // In a real implementation, this would play actual audio
                isPlaying = true;
                document.getElementById('songTitle').textContent = "Simulated Visualization - Running";
                loop();
            }
        });
        
        document.getElementById('pauseButton').addEventListener('click', function() {
            if (isPlaying) {
                isPlaying = false;
                document.getElementById('songTitle').textContent = "Simulated Visualization - Paused";
                noLoop();
            }
        });
        
        document.getElementById('randomizeButton').addEventListener('click', function() {
            document.getElementById('bassSlider').value = random(0, 100);
            document.getElementById('trebleSlider').value = random(0, 100);
            document.getElementById('intensitySlider').value = random(50, 100);
            document.getElementById('speedSlider').value = random(30, 80);
        });
        
        // File input for audio
        document.getElementById('audioFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audioElement.src = url;
                document.getElementById('songTitle').textContent = file.name;
            }
        });
        
        // Initialize with circle visualization
        window.addEventListener('load', function() {
            // Start with a simulated visualization
            isPlaying = true;
            loop();
        });
    </script>
</body>
</html>
